name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to the commit SHA.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
      GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${{ inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            image_tag="$GITHUB_SHA"
          fi

          image="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${CLOUD_RUN_SERVICE}:${image_tag}"
          docker build \
            --build-arg "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}" \
            -t "$image" \
            .
          docker push "$image"

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        # `--update-env-vars` (not `--set-env-vars`) so the env vars already
        # configured on the service are preserved.
        #
        # DEVTO_API_KEY is injected here, at runtime. It must never be passed as
        # a `--build-arg`: build args are recorded in the image history and are
        # readable by anyone who can pull the image.
        #
        # ADMIN_SESSION_SECRET and INTERNAL_API_TOKEN come from Secret Manager so
        # their values stay out of the service definition. /admin signs its login
        # cookie with the first and authenticates the config-reload call to the
        # Mastra process with the second.
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "${{ steps.image.outputs.image }}" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --update-env-vars "DEVTO_USERNAME=${{ vars.DEVTO_USERNAME }},DEVTO_API_KEY=${{ secrets.DEVTO_API_KEY }}" \
            --update-secrets "ADMIN_SESSION_SECRET=admin-session-secret:latest,INTERNAL_API_TOKEN=internal-api-token:latest" \
            --quiet
